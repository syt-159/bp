name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'
      
      - name: Restore dependencies and audit NuGet packages
        run: |
          dotnet restore BPCalculator.sln \
            -p:NuGetAudit=true \
            -p:NuGetAuditMode=all \
            -p:NuGetAuditLevel=high \
            -p:WarningsAsErrors=NU1903%3BNU1904
      
      - name: Install SonarScanner for .NET
        run: dotnet tool install dotnet-sonarscanner --tool-path "$RUNNER_TEMP/scanner"

      - name: Authenticate with SonarQube Cloud
        uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
        id: auth

      - name: SonarScanner Begin
        env:
          SONAR_TOKEN: ${{ steps.auth.outputs.sonar-token }}
        run: |
          "$RUNNER_TEMP/scanner/dotnet-sonarscanner" begin \
            /k:"syt-159_bp" \
            /o:"syt-159" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.opencover.reportsPaths="BPCalculator.Tests/TestResults/**/coverage.opencover.xml" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=300


      - name: Build application
        run: dotnet build BPCalculator.sln --no-restore

      - name: Run tests and collect coverage
        id: tests
        run: >-
          dotnet test BPCalculator.Tests/BPCalculator.Tests.csproj
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory BPCalculator.Tests/TestResults
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura,opencover

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            BPCalculator.Tests/TestResults/**/coverage.cobertura.xml
            BPCalculator.Tests/TestResults/**/coverage.opencover.xml

      - name: SonarScanner End and Quality Gate Check
        env:
          SONAR_TOKEN: ${{ steps.auth.outputs.sonar-token }}
        run: |
          "$RUNNER_TEMP/scanner/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"

      - name: Show the coverage and enforce 80% threshold
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          file=$(find BPCalculator.Tests/TestResults -name "coverage.cobertura.xml" -print -quit)
          if [ -z "$file" ]; then
            echo "Coverage report not found"
            exit 1
          fi
          coverage=$(grep -o 'line-rate="[0-9.]*"' "$file" | head -n 1 | cut -d '"' -f2)
          echo "Line coverage: $coverage"
          awk -v rate="$coverage" 'BEGIN { exit !(rate >= 0.8) }'

